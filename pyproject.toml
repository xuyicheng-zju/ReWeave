[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "reweave-robotics"
dynamic = ["version"]
description = "Topology-guided harness evolution for embodied agents"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "third_party/README.md"]
authors = [{name = "ReWeave contributors"}]
keywords = ["robotics", "embodied-agents", "harness-evolution"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "claude-agent-sdk>=0.2.152,<0.3",
    "dulwich>=0.22",
    "fastapi>=0.110",
    "httpx>=0.27",
    "huggingface-hub>=0.24",
    "imageio[ffmpeg]>=2.34",
    "jsonschema>=4.21",
    "mcp>=1.23,<2",
    "numpy>=1.26",
    "openai-codex>=0.163,<0.164",
    "pillow>=10",
    "prompt-toolkit>=3.0.48",
    "pydantic>=2.12,<3",
    "pydantic-ai-slim[anthropic,openai]>=2.1,<3",
    "pyyaml>=6",
    "scipy>=1.10",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
retrieval = ["sentence-transformers>=3", "transformers>=4.51"]
graspgen = ["msgpack>=1", "msgpack-numpy>=0.4.8", "pyzmq>=25"]
remote = ["paramiko>=3"]
test = ["gymnasium", "omegaconf", "paramiko>=3", "pytest>=8", "pytest-timeout>=2"]

[project.scripts]
reweave = "reweave.cli.main:main"
reweave-evolve = "reweave.cli.evolve:main"
reweave-distill = "reweave.cli.distill:main"

[tool.setuptools.dynamic]
version = {attr = "reweave.__version__"}

[tool.setuptools.packages.find]
include = ["reweave*"]
namespaces = false

[tool.setuptools.package-data]
"reweave.dashboard" = ["*.html", "static/*.css", "static/*.js"]
"reweave.benchmarks.libero" = ["guides/*.md"]
"reweave.benchmarks.robodojo" = ["vla_prior.json"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["tests"]
timeout = 60

[tool.ruff]
target-version = "py311"
